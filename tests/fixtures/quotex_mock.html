<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin: 0; width: 1600px; height: 900px; font-family: sans-serif; background: #1d2130; color: #fff; position: relative; }
  .abs { position: absolute; }
  #asset { left: 70px; top: 140px; background: #000; padding: 8px; cursor: pointer; }
  #acct { left: 1300px; top: 10px; }
  #right { left: 1300px; top: 140px; width: 280px; }
  #modal { left: 10px; top: 200px; width: 600px; background: #222; display: none; padding: 10px; }
  .row { padding: 8px; cursor: pointer; }
  button { display: block; width: 260px; margin: 8px 0; padding: 12px; }
</style></head><body>
  <div id="acct" class="abs"><div id="acctType">CONTA DEMO</div><div id="bal">$10,000.00</div></div>
  <div id="asset" class="abs"><span id="assetName">GBP/USD (OTC)</span><br><span>79%</span></div>
  <div id="modal" class="abs">
    <input id="search" placeholder="Procurar">
    <div class="row" data-name="EUR/USD (OTC)">EUR/USD (OTC) 86%</div>
    <div class="row" data-name="EUR/USD">EUR/USD 82%</div>
    <div class="row" data-name="GBP/USD">GBP/USD 80%</div>
  </div>
  <div id="right" class="abs">
    <div id="hdr"><span id="hdrName">GBP/USD (OTC)</span> <span id="hdrPct">79%</span></div>
    <div><div>Tempo</div><input id="tempo" value="00:01:00"></div>
    <div><div>Investimento</div><input id="inv" value="1"></div>
    <button id="buy">Comprar</button>
    <button id="sell">Vender</button>
    <div id="log"></div>
  </div>
<script>
  const pcts = {"EUR/USD (OTC)": "86%", "EUR/USD": "82%", "GBP/USD": "80%"};
  document.getElementById('asset').onclick = () => { document.getElementById('modal').style.display = 'block'; };
  document.querySelectorAll('.row').forEach(r => r.onclick = () => {
    const n = r.dataset.name;
    document.getElementById('assetName').textContent = n;
    document.getElementById('hdrName').textContent = n;
    document.getElementById('hdrPct').textContent = pcts[n];
    document.getElementById('modal').style.display = 'none';
  });
  window.orders = [];
  const bal = () => parseFloat(document.getElementById('bal').textContent.replace(/[$,]/g, ''));
  const place = (dir) => {
    const amt = parseFloat(document.getElementById('inv').value);
    window.orders.push({dir, amt, tempo: document.getElementById('tempo').value, asset: document.getElementById('hdrName').textContent});
    document.getElementById('bal').textContent = '$' + (bal() - amt).toLocaleString('en-US', {minimumFractionDigits: 2});
  };
  document.getElementById('buy').onclick = () => place('CALL');
  document.getElementById('sell').onclick = () => place('PUT');
</script>
</body></html>
